<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>表情包</title>

<style>

html,
body {
  margin:0;
  padding:0;
  width:100%;
  background:transparent;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    sans-serif;
}

body {
  display:flex;
  justify-content:center;
  align-items:center;
}

#app {
  width:100%;
  display:flex;
  justify-content:center;
}


.image-box {
  display:flex;
  justify-content:center;
  align-items:center;
}


.image-box img {

  display:block;

  width:auto;

  max-width:220px;

  max-height:220px;

  object-fit:contain;

  border-radius:12px;

}


.status {

  padding:12px;

  font-size:14px;

  color:#888;

  text-align:center;

}


.error {

  padding:12px;

  font-size:14px;

  color:#c00;

}

</style>

</head>


<body>

<div id="app">

<div class="status">
正在等待表情包……
</div>

</div>


<script>


const app =
document.getElementById("app");


let rpcId = 0;


const pendingRequests =
new Map();



function rpcRequest(method,params={}){


return new Promise((resolve,reject)=>{


const id =
++rpcId;


pendingRequests.set(
id,
{
resolve,
reject
}
);



window.parent.postMessage(
{
jsonrpc:"2.0",
id,
method,
params
},
"*"
);


});


}



function rpcNotify(method,params={}){


window.parent.postMessage(
{
jsonrpc:"2.0",
method,
params
},
"*"
);


}



function escapeHtml(value){


return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");


}




function extractResult(message){


if(
message?.params?.structuredContent
){

return message.params.structuredContent;

}



if(
message?.params?.result?.structuredContent
){

return message.params.result.structuredContent;

}



if(
message?.params?.result
){

return message.params.result;

}



if(message?.result){

return message.result;

}



return null;


}




function showStatus(text){


app.innerHTML = `

<div class="status">

${escapeHtml(text)}

</div>

`;


}



function showError(text){


app.innerHTML = `

<div class="error">

${escapeHtml(text)}

</div>

`;


}




function render(data){


console.log(
"MCP表情包数据:",
data
);



if(!data){

showStatus(
"没有收到表情包"
);

return;

}



if(data.do_not_send===true){

showStatus(
"没有合适的表情包"
);

return;

}



const imageUrl =

data.image_url ||

data.imageUrl ||

data.url ||

data.image ||

"";



if(!imageUrl){


showStatus(
"没有图片地址"
);


return;


}



app.innerHTML = `


<div class="image-box">


<img

id="sticker-image"

src="${escapeHtml(imageUrl)}"

alt="表情包"


>


</div>


`;



const img =
document.getElementById(
"sticker-image"
);



if(img){


img.onerror=()=>{

showError(
"图片加载失败"
);

};


}


}




window.addEventListener(
"message",
(event)=>{


if(
event.source !== window.parent
){

return;

}



const message =
event.data;



if(
!message ||
message.jsonrpc !== "2.0"
){

return;

}




/*
 JSON-RPC 响应
*/

if(
typeof message.id === "number"
){


const pending =
pendingRequests.get(
message.id
);



if(!pending){

return;

}



pendingRequests.delete(
message.id
);



if(message.error){


pending.reject(
message.error
);


return;


}



pending.resolve(
message.result
);


return;


}




/*
 MCP Apps 通知
*/


if(
typeof message.method !== "string"
){

return;

}



if(
message.method ===
"ui/notifications/tool-result"
){


const result =
extractResult(message);



if(result){

render(result);

}
else{

showStatus(
"没有解析到表情包"
);

}


}



},
{
passive:true
}

);





async function initializeBridge(){


try{


const result =
await rpcRequest(
"ui/initialize",
{

appInfo:{

name:
"cove-sticker-card",

version:
"2.0.0",

title:
"表情包"

},


appCapabilities:{},


protocolVersion:
"2026-01-26"


}
);



console.log(
"MCP Apps 初始化成功:",
result
);



rpcNotify(
"ui/notifications/initialized",
{}
);



}

catch(error){


console.error(
"MCP Apps 初始化失败:",
error
);



showStatus(
"初始化失败"
);


}





/*
兼容 ChatGPT window.openai
*/


try{


if(
window.openai &&
window.openai.toolOutput
){


render(
window.openai.toolOutput
);


}


}
catch(error){


console.error(
"读取 toolOutput 失败:",
error
);


}



}



initializeBridge();



</script>


</body>

</html>
