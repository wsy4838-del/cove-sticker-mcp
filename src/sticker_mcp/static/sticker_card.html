<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>表情包</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: transparent;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    }

    body {
      padding: 12px;
    }

    #app {
      width: 100%;
    }

    .card {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      overflow: hidden;

      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 18px;

      background: #ffffff;

      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.08);
    }

    .image-box {
      width: 100%;
      min-height: 120px;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #f7f7f7;
    }

    .image-box img {
      display: block;

      width: 100%;
      height: auto;

      max-height: 520px;

      object-fit: contain;
    }

    .info {
      padding: 12px 14px 14px;
    }

    .title {
      margin-bottom: 6px;

      font-size: 16px;
      font-weight: 600;

      color: #222;
    }

    .description {
      font-size: 13px;
      line-height: 1.5;

      color: #777;

      word-break: break-word;
    }

    .status {
      width: 100%;
      max-width: 420px;

      margin: 0 auto;

      padding: 22px 16px;

      border-radius: 16px;

      background: #ffffff;

      border: 1px solid rgba(0, 0, 0, 0.08);

      text-align: center;

      color: #666;

      font-size: 14px;

      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.06);
    }

    .error {
      width: 100%;
      max-width: 420px;

      margin: 0 auto;

      padding: 20px;

      border-radius: 16px;

      background: #fff5f5;

      border: 1px solid #ffd6d6;

      color: #b42318;

      font-size: 14px;

      line-height: 1.5;

      word-break: break-word;
    }
  </style>
</head>

<body>

  <div id="app">

    <div class="status">
      🥰 表情包组件已加载<br>
      <small>正在等待表情包数据……</small>
    </div>

  </div>

  <script>

    /*
     * ==========================================
     * 基础变量
     * ==========================================
     */

    const app = document.getElementById("app");

    let rpcId = 0;

    const pendingRequests = new Map();


    /*
     * ==========================================
     * JSON-RPC 请求
     * ==========================================
     */

    function rpcRequest(method, params = {}) {

      return new Promise((resolve, reject) => {

        const id = ++rpcId;

        pendingRequests.set(id, {
          resolve,
          reject
        });

        window.parent.postMessage(
          {
            jsonrpc: "2.0",
            id,
            method,
            params
          },
          "*"
        );

      });

    }


    /*
     * ==========================================
     * JSON-RPC 通知
     * ==========================================
     */

    function rpcNotify(method, params = {}) {

      window.parent.postMessage(
        {
          jsonrpc: "2.0",
          method,
          params
        },
        "*"
      );

    }


    /*
     * ==========================================
     * HTML 转义
     * ==========================================
     */

    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /*
     * ==========================================
     * 从各种可能的数据结构中取得结果
     * ==========================================
     */

    function extractResult(message) {

      if (!message) {
        return null;
      }

      /*
       * 标准 MCP Apps：
       *
       * message.params.structuredContent
       */

      if (
        message.params &&
        message.params.structuredContent
      ) {

        return message.params.structuredContent;

      }


      /*
       * 某些 Host 可能再套一层 result
       */

      if (
        message.params &&
        message.params.result &&
        message.params.result.structuredContent
      ) {

        return message.params.result.structuredContent;

      }


      /*
       * 兼容 params.result
       */

      if (
        message.params &&
        message.params.result
      ) {

        return message.params.result;

      }


      /*
       * 兼容 message.result
       */

      if (message.result) {

        return message.result;

      }


      return null;

    }


    /*
     * ==========================================
     * 显示状态
     * ==========================================
     */

    function showStatus(text) {

      app.innerHTML = `

        <div class="status">

          ${escapeHtml(text)}

        </div>

      `;

    }


    /*
     * ==========================================
     * 显示错误
     * ==========================================
     */

    function showError(text) {

      app.innerHTML = `

        <div class="error">

          ${escapeHtml(text)}

        </div>

      `;

    }


    /*
     * ==========================================
     * 渲染表情包
     * ==========================================
     */

    function render(data) {

      console.log(
        "MCP Apps 收到表情包数据:",
        data
      );


      /*
       * 没有数据
       */

      if (!data) {

        showStatus(
          "表情包组件已加载，但暂时没有收到数据。"
        );

        return;

      }


      /*
       * 工具明确表示不要发送
       */

      if (data.do_not_send === true) {

        showStatus(
          "这次没有选到合适的表情包。"
        );

        return;

      }


      /*
       * 兼容各种图片字段名称
       */

      const imageUrl =
        data.image_url ||
        data.imageUrl ||
        data.url ||
        data.image ||
        "";


      /*
       * 标题
       */

      const title =
        data.title ||
        data.name ||
        data.filename ||
        "表情包";


      /*
       * 描述
       */

      const description =
        data.description ||
        data.caption ||
        "";


      /*
       * 没有图片地址
       */

      if (!imageUrl) {

        showStatus(
          "表情包已经返回，但没有收到图片地址。"
        );

        return;

      }


      /*
       * 显示图片
       */

      app.innerHTML = `

        <div class="card">

          <div class="image-box">

            <img
              id="sticker-image"
              src="${escapeHtml(imageUrl)}"
              alt="${escapeHtml(title)}"
            >

          </div>

          <div class="info">

            <div class="title">
              ${escapeHtml(title)}
            </div>

            ${
              description
                ? `
                  <div class="description">
                    ${escapeHtml(description)}
                  </div>
                `
                : ""
            }

          </div>

        </div>

      `;


      /*
       * 监听图片加载错误
       */

      const image =
        document.getElementById(
          "sticker-image"
        );


      if (image) {

        image.addEventListener(
          "load",
          () => {

            console.log(
              "表情包图片加载成功"
            );

          }
        );


        image.addEventListener(
          "error",
          () => {

            showError(
              "已经收到图片地址，但是图片加载失败。"
            );

          }
        );

      }

    }


    /*
     * ==========================================
     * 接收 Host 消息
     * ==========================================
     */

    window.addEventListener(
      "message",
      (event) => {

        /*
         * 只接受父窗口消息
         */

        if (
          event.source !== window.parent
        ) {

          return;

        }


        const message =
          event.data;


        /*
         * 必须是 JSON-RPC
         */

        if (
          !message ||
          message.jsonrpc !== "2.0"
        ) {

          return;

        }


        /*
         * ======================================
         * JSON-RPC Response
         * ======================================
         */

        if (
          typeof message.id === "number"
        ) {

          const pending =
            pendingRequests.get(
              message.id
            );


          if (!pending) {

            return;

          }


          pendingRequests.delete(
            message.id
          );


          if (message.error) {

            pending.reject(
              message.error
            );

            return;

          }


          pending.resolve(
            message.result
          );


          return;

        }


        /*
         * ======================================
         * Notification
         * ======================================
         */

        if (
          typeof message.method !== "string"
        ) {

          return;

        }


        /*
         * 工具输入
         */

        if (
          message.method ===
          "ui/notifications/tool-input"
        ) {

          console.log(
            "收到工具输入:",
            message
          );

          return;

        }


        /*
         * 工具结果
         */

        if (
          message.method ===
          "ui/notifications/tool-result"
        ) {

          console.log(
            "收到工具结果:",
            message
          );


          const result =
            extractResult(message);


          if (result) {

            render(result);

          } else {

            showStatus(
              "表情包组件已加载，但没有解析到工具结果。"
            );

          }


          return;

        }

      },

      {
        passive: true
      }

    );


    /*
     * ==========================================
     * MCP Apps 初始化
     * ==========================================
     */

    async function initializeBridge() {

      console.log(
        "正在初始化 MCP Apps……"
      );


      const appInfo = {

        name:
          "cove-sticker-card",

        version:
          "1.1.0",

        title:
          "表情包"

      };


      const appCapabilities = {};


      const protocolVersion =
        "2026-01-26";


      try {

        /*
         * 向 ChatGPT / Host 请求初始化
         */

        const result =
          await rpcRequest(
            "ui/initialize",
            {
              appInfo,
              appCapabilities,
              protocolVersion
            }
          );


        console.log(
          "MCP Apps 初始化成功:",
          result
        );


        /*
         * 告诉 Host：
         * UI 已经准备完成
         */

        rpcNotify(
          "ui/notifications/initialized",
          {}
        );


        console.log(
          "已发送 initialized 通知"
        );

      } catch (error) {

        console.error(
          "MCP Apps 初始化失败:",
          error
        );


        /*
         * 注意：
         * 即使初始化失败，
         * 页面本身仍然保持可见。
         */

        showStatus(
          "表情包组件已经加载，但 MCP Apps 初始化失败。"
        );

      }


      /*
       * ========================================
       * ChatGPT window.openai 兼容
       * ========================================
       */

      try {

        if (
          window.openai &&
          window.openai.toolOutput
        ) {

          console.log(
            "发现 window.openai.toolOutput"
          );


          render(
            window.openai.toolOutput
          );

        }

      } catch (error) {

        console.error(
          "读取 window.openai.toolOutput 失败:",
          error
        );

      }

    }


    /*
     * ==========================================
     * 启动
     * ==========================================
     */

    initializeBridge();

  </script>

</body>
</html>
