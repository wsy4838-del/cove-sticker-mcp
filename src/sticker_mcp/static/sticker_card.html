<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>表情包</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      background: transparent;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    .image-box {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 120px;
      background: #f7f7f7;
    }

    .image-box img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      object-fit: contain;
    }

    .info {
      padding: 12px 14px 14px;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      color: #222;
      margin-bottom: 6px;
    }

    .description {
      font-size: 13px;
      line-height: 1.5;
      color: #777;
      word-break: break-word;
    }

    .empty {
      padding: 24px 16px;
      text-align: center;
      color: #888;
      font-size: 14px;
    }

    .error {
      padding: 20px;
      color: #b42318;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div id="app">
    <div class="empty">
      正在连接表情包……
    </div>
  </div>

  <script>
    const app = document.getElementById("app");

    /*
     * ==========================================
     * MCP Apps 标准桥接
     * ==========================================
     */

    let rpcId = 0;

    const pendingRequests = new Map();

    function rpcNotify(method, params = {}) {
      window.parent.postMessage(
        {
          jsonrpc: "2.0",
          method,
          params
        },
        "*"
      );
    }

    function rpcRequest(method, params = {}) {
      return new Promise((resolve, reject) => {
        const id = ++rpcId;

        pendingRequests.set(id, {
          resolve,
          reject
        });

        window.parent.postMessage(
          {
            jsonrpc: "2.0",
            id,
            method,
            params
          },
          "*"
        );
      });
    }

    /*
     * ==========================================
     * HTML 安全转义
     * ==========================================
     */

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    /*
     * ==========================================
     * 从 MCP Tool Result 中取得数据
     * ==========================================
     */

    function getToolResult(message) {
      return (
        message?.params?.structuredContent ??
        message?.params?.result?.structuredContent ??
        message?.params?.result ??
        message?.result ??
        null
      );
    }

    /*
     * ==========================================
     * 渲染表情包
     * ==========================================
     */

    function render(data) {
      if (!data) {
        app.innerHTML = `
          <div class="empty">
            暂时没有收到表情包数据
          </div>
        `;

        return;
      }

      const imageUrl =
        data.image_url ||
        data.imageUrl ||
        data.url ||
        "";

      const title =
        data.title ||
        data.name ||
        "表情包";

      const description =
        data.description ||
        data.caption ||
        "";

      /*
       * 没有图片地址
       */

      if (!imageUrl) {
        app.innerHTML = `
          <div class="empty">
            找到了表情包，但没有收到图片地址。
          </div>
        `;

        return;
      }

      /*
       * 渲染图片卡片
       */

      app.innerHTML = `
        <div class="card">

          <div class="image-box">
            <img
              src="${escapeHtml(imageUrl)}"
              alt="${escapeHtml(title)}"
              loading="lazy"
            />
          </div>

          <div class="info">

            <div class="title">
              ${escapeHtml(title)}
            </div>

            ${
              description
                ? `
                  <div class="description">
                    ${escapeHtml(description)}
                  </div>
                `
                : ""
            }

          </div>

        </div>
      `;

      /*
       * 图片加载失败
       */

      const img = app.querySelector("img");

      if (img) {
        img.addEventListener("error", () => {
          app.innerHTML = `
            <div class="error">
              图片地址已经收到，
              但是图片加载失败。
            </div>
          `;
        });
      }
    }

    /*
     * ==========================================
     * 接收 Host 消息
     * ==========================================
     */

    window.addEventListener(
      "message",
      (event) => {

        if (event.source !== window.parent) {
          return;
        }

        const message = event.data;

        if (
          !message ||
          message.jsonrpc !== "2.0"
        ) {
          return;
        }

        /*
         * JSON-RPC response
         */

        if (
          typeof message.id === "number"
        ) {

          const pending =
            pendingRequests.get(
              message.id
            );

          if (!pending) {
            return;
          }

          pendingRequests.delete(
            message.id
          );

          if (message.error) {
            pending.reject(
              message.error
            );

            return;
          }

          pending.resolve(
            message.result
          );

          return;
        }

        /*
         * JSON-RPC notification
         */

        if (
          typeof message.method !== "string"
        ) {
          return;
        }

        /*
         * 工具输入
         */

        if (
          message.method ===
          "ui/notifications/tool-input"
        ) {
          return;
        }

        /*
         * 工具结果
         */

        if (
          message.method ===
          "ui/notifications/tool-result"
        ) {

          const result =
            getToolResult(message);

          if (result) {
            render(result);
          }

          return;
        }
      },
      {
        passive: true
      }
    );

    /*
     * ==========================================
     * MCP Apps 初始化
     * ==========================================
     */

    async function initializeBridge() {

      const appInfo = {
        name: "cove-sticker-card",
        version: "1.0.0",
        title: "表情包"
      };

      const appCapabilities = {};

      /*
       * 当前 MCP Apps 标准版本
       */

      const protocolVersion =
        "2026-01-26";

      try {

        await rpcRequest(
          "ui/initialize",
          {
            appInfo,
            appCapabilities,
            protocolVersion
          }
        );

        /*
         * 告诉 Host：
         * UI 已经准备好了
         */

        rpcNotify(
          "ui/notifications/initialized",
          {}
        );

      } catch (error) {

        console.log(
          "MCP Apps 初始化失败",
          error
        );

      }

      /*
       * ChatGPT 兼容读取。
       *
       * 如果 Host 同时提供 window.openai，
       * 也尝试读取 toolOutput。
       */

      try {

        if (
          window.openai &&
          window.openai.toolOutput
        ) {

          render(
            window.openai.toolOutput
          );

        }

      } catch (error) {

        console.log(
          "读取 window.openai.toolOutput 失败",
          error
        );

      }
    }

    /*
     * ==========================================
     * 启动
     * ==========================================
     */

    initializeBridge();

  </script>

</body>
</html>
