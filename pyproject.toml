[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "sticker-mcp"
version = "0.1.0.dev1"
description = "Local-first custom sticker library and standard MCP server for agents."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "moonlin"}]
dependencies = [
  "mcp==2.0.0",
  "Pillow>=10.4,<13",
  "httpx>=0.28,<1",
  "starlette>=0.46,<1",
  "uvicorn>=0.34,<1",
  "platformdirs>=4.3,<5",
  "filelock>=3.16,<4",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.12,<1",
  "build>=1.2,<2",
]

[project.scripts]
sticker-mcp = "sticker_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sticker_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE", "/NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
